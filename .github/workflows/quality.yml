name: Qualité PIA-TRACE

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: API — tests et compilation
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/pia_trace
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/pia_trace_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: pia_trace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d pia_trace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build
      - name: Installer le schéma de recette isolée
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/pia_trace_test
      - run: npm run test:protection-db
      - run: npm run test:admin-db

  web:
    name: Web — compilation de production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build
